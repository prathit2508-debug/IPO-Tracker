name: IPO tracker
on:
  schedule:
    - cron: "5 11 * * 1-5"    # 4:35 PM IST, Mon-Fri (after market close)
    - cron: "30 14 * * 1-5"   # 8:00 PM IST catch-up run for any late price data
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ipo-tracker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python ipo_tracker.py
      - name: Save results
        run: |
          git config user.name "ipo-tracker"
          git config user.email "bot@users.noreply.github.com"
          git add state.json docs/index.html docs/excluded.json
          if ! git diff --cached --quiet; then git commit -m "Daily update"; git push; fi
