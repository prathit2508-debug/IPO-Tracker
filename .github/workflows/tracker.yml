name: IPO tracker
on:
  schedule:
    - cron: "0 11 * * 1-5"   # 4:30 PM IST, Mon-Fri (after market close)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python ipo_tracker.py
      - name: Save results
        run: |
          git config user.name "ipo-tracker"
          git config user.email "bot@users.noreply.github.com"
          git add state.json docs/index.html
          if ! git diff --cached --quiet; then git commit -m "Daily update"; git push; fi
